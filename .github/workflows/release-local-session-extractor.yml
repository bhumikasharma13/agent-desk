# Packs packages/local-session-extractor into a .tgz and attaches it to a GitHub Release when a
# local-session-extractor-v* tag is pushed, so `npx <its URL>` runs it and `pnpm add <its URL>` adds it.
# It never runs on a branch push, and the app's v* tags do not trigger it.
name: Release local-session-extractor
on:
  push:
    tags: ["local-session-extractor-v*"]
permissions:
  contents: read
jobs:
  publish:
    name: Attach local-session-extractor to its GitHub Release
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      # gh release create makes the release and uploads the .tgz.
      contents: write
      # The build provenance attestation for the .tgz: a signing token and the attestations API.
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: packages/local-session-extractor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Publish only a commit that is on main, never one tagged on an unmerged branch. fetch-depth 0
      # already fetched origin/main; a separate fetch would need the credentials not persisted above.
      - name: Check the tagged commit is on main
        working-directory: .
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Check the tag matches the package version
        run: test "local-session-extractor-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Check the changelog entry is dated and not empty
        run: |
          version=$(node -p 'require("./package.json").version')
          grep -Fm1 "## [$version] - " CHANGELOG.md | grep -Eq ' - [0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            || { echo "::error::CHANGELOG.md has no dated ## [$version] entry"; exit 1; }
          entry=$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" { on = 1; next } on && /^(## )?\[/ { exit } on { print }' CHANGELOG.md)
          [ -n "$(printf '%s' "$entry" | tr -d '[:space:]')" ] || { echo "::error::CHANGELOG.md's ## [$version] entry is empty"; exit 1; }
      - run: pnpm test
      # prepack builds dist/ and copies the root LICENSE into the .tgz, beside the package's NOTICE.
      # The README's URL ends in this file name, so it must be <name>-<version>.tgz.
      - name: Pack the package once
        id: pack
        run: |
          version=$(node -p 'require("./package.json").version')
          # prepack prints to stdout too; pnpm pack prints the tarball's path last.
          tarball="$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          test "$(basename "$tarball")" = "local-session-extractor-$version.tgz"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      # The smoke install checks the very file the release attaches.
      - run: scripts/smoke-install.sh "$TARBALL"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
      # Records where and how the .tgz was built; `gh attestation verify <file> -R <owner>/<repo>` checks it.
      - name: Attest the .tgz's build provenance
        # Attestations need a public repository on this plan; a private one releases with the .sha256 only.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Publish the release with the .tgz and the changelog entry as notes
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          version=$(node -p 'require("./package.json").version')
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" { on = 1; next } on && /^(## )?\[/ { exit } on { print }' CHANGELOG.md > "$notes"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$TARBALL")"
          # An indented block is Markdown code, as a fence would be.
          { echo; echo "### Run"; echo; echo "    npx \"$url\" --help"; } >> "$notes"
          (cd "$(dirname "$TARBALL")" && shasum -a 256 "$(basename "$TARBALL")" > "$TARBALL.sha256")
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes" "$TARBALL" "$TARBALL.sha256"
