# Checks the dependencies against published advisories on every push to main, weekly and on
# demand. It does not run on pull requests, so an advisory published mid-review does not fail a
# contributor's change; main reports it here instead.
name: Vulnerability check
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Vulnerability check
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: pnpm audit --prod
      # Every dependency, build tools included. The advisories with no fix are ignored by id in
      # package.json (pnpm.auditConfig.ignoreGhsas); CONTRIBUTING.md says why each is.
      - run: pnpm audit --audit-level=high
