# Agent Desk ships as source (README, Build from source): a v* tag publishes a GitHub Release with
# the version's changelog entry as its notes, and GitHub attaches the source archives. No app build
# is uploaded; `pnpm make` stays a local check.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    name: Publish the release notes
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Publish only a commit that is on main, never one tagged on an unmerged branch. fetch-depth 0
      # already fetched origin/main; a separate fetch would need the credentials not persisted above.
      - name: Check the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release builds from a clean install, as the package releases do.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Check the changelog entry is dated and not empty
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fm1 "## [$version] - " CHANGELOG.md | grep -Eq ' - [0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            || { echo "::error::CHANGELOG.md has no dated ## [$version] entry"; exit 1; }
          entry=$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" { on = 1; next } on && /^(## )?\[/ { exit } on { print }' CHANGELOG.md)
          [ -n "$(printf '%s' "$entry" | tr -d '[:space:]')" ] || { echo "::error::CHANGELOG.md's ## [$version] entry is empty"; exit 1; }
      - name: Publish the release with the changelog entry as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" { on = 1; next } on && /^(## )?\[/ { exit } on { print }' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
